# exemplo de configuração local. copie para application-local.properties e ajuste. inicie com:
# export OPENROUTER_API_KEY=...
# export JWT_SECRET=...
# mvn spring-boot:run -Dspring-boot.run.profiles=local

# CORS (separar múltiplas origens por vírgula)
cors.allowed-origins=http://localhost:3000,http://localhost:5173

# datasource (local)
spring.datasource.url=jdbc:postgresql://localhost:5432/ig_scraper_local
spring.datasource.username=postgres
spring.datasource.password=sua-senha-local
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# =======

# exemplo de configuração PROD. copie para application-prod.properties e ajuste. inicie com:
# export DATABASE_URL=...
# export DATABASE_USER=...
# export DATABASE_PASSWORD=...
# export OPENROUTER_API_KEY=...
# export JWT_SECRET=...
# mvn spring-boot:run -Dspring-boot.run.profiles=prod

# datasource (prod)
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
src/test/resources/application-test.properties=true
spring.flyway.locations=classpath:db/migration
